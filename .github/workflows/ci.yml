name: Backend CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
    branches: ['main']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Syntax check
        shell: bash
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
